services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frammer-backend
    expose:
      - "8000"
    volumes:
      - ./data:/app/frammer_agent/data
      - ./logs:/app/frammer_agent/logs
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - FRAMMER_DATA_DIR=/app
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - frammer-net

  nginx:
    image: nginx:alpine
    container_name: frammer-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frammer-net

networks:
  frammer-net:
    driver: bridge
